<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css?family=Poppins:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic" rel="stylesheet" />
</head>
<body>
    <div class="container">
        <div class="header-row">
            <h1>Expense Tracker</h1>
            <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
        </div>

        <div class="balance-container">
            <h2>Your Balance</h2>
            <h1 id="balance">$0.00</h1>

            <div class="summary">
                <div class="income">
                    <h3>Income</h3>
                    <p id="income-amount">$0.00</p>
                </div>
                <div class="expenses">
                    <h3>Expenses</h3>
                    <p id="expense-amount">$0.00</p>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="transaction-container">
                <h2>Transactions</h2>

                <div class="toolbar">
                    <input type="text" id="search-input" placeholder="Search transactions...">
                    <select id="category-filter"></select>
                </div>

                <ul id="transaction-list">
                <!-- transaction     -->
                </ul>

                <div class="list-empty" id="list-empty" style="display:none;">No transactions yet. Add your first one!</div>

                <div class="data-actions">
                    <button type="button" id="export-json-btn" class="data-btn">Export JSON</button>
                    <button type="button" id="export-csv-btn" class="data-btn">Export CSV</button>
                    <label for="import-input" class="data-btn import-label">Import JSON</label>
                    <input type="file" id="import-input" accept="application/json" hidden>
                </div>
            </div>
            <div class="form-container">
                <h2 id="form-title">Add Transaction</h2>

                <form id="transaction-form">
                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" placeholder="Enter description..." required>
                    </div>

                    <div class="form-group">
                        <label for="amount">Amount</label>
                        <input type="number" id="amount" step="0.01" placeholder="Enter amount..." required>
                        <small>Use negative(-) for expenses</small>
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category"></select>
                    </div>

                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" required>
                    </div>

                    <button type="submit" id="submit-btn">Add Transaction</button>
                    <button type="button" id="cancel-edit-btn" class="cancel-btn" style="display:none;">Cancel Edit</button>
                </form>
            </div>
        </div>
    </div>
    <script src="script.js"></script>   
</body>
</html>
